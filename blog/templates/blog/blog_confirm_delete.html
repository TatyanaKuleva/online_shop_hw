{% extends 'blog/base.html' %}

{% block content %}
<div class="container mt-4">
    <div class="alert alert-warning" role="alert">
        <h4 class="alert-heading">Вы уверены, что хотите удалить запись? </h4>
        <p>Запись: <strong>"{{ blogpost.title }}"</strong> будет удалена безвозвратно.</p>
        <hr>
        <form method="post">
            {% csrf_token %}
            <button type="submit" class="btn btn-primary">Да, удалить</button>
            <a href="{% url 'blog:detail' blogpost.pk %}" class="btn btn-secondary">Отмена</a>
        </form>
    </div>
</div>
{% endblock %}
