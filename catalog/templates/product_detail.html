{% extends 'base.html' %}
{% block content %}

<div class="container">
    <div class="row text-center">
        <div class="col-3">
            <div class="card mb-4 box-shadow">
                <div class="card-header">
                    <h5 class="my-0 font-weight-normal product-name-area ">{{product.name}}</h5>
                    <img src="{{ product.images.url }}" alt="{{ product.name }}" style="width: 250px; height: 120px;">
                </div>
                <div class="card-body">
                    <h1 class="card-title pricing-card-title"></h1>
                    <ul class="list-unstyled mt-3 mb-5 text-start m-3">
                        <li class="mb-5"> {{product.description|truncatechars:100}}</li>
                        <li class="mb-5"> {{product.price}} RUB</li>

                    </ul>
                    <button type="button" class="btn btn-lg btn-block btn-outline-primary">Купить</button>
                </div>
            </div>
        </div>
    </div>

{% endblock %}
